<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#C4527A"/>

  <!-- Flower / rose petals -->
  <ellipse cx="32" cy="20" rx="5" ry="8" fill="#F9A8C9" opacity="0.9"/>
  <ellipse cx="32" cy="44" rx="5" ry="8" fill="#F9A8C9" opacity="0.9"/>
  <ellipse cx="20" cy="32" rx="8" ry="5" fill="#F9A8C9" opacity="0.9"/>
  <ellipse cx="44" cy="32" rx="8" ry="5" fill="#F9A8C9" opacity="0.9"/>
  <ellipse cx="22.5" cy="22.5" rx="5" ry="8" fill="#F472B6" opacity="0.85" transform="rotate(45 22.5 22.5)"/>
  <ellipse cx="41.5" cy="22.5" rx="5" ry="8" fill="#F472B6" opacity="0.85" transform="rotate(-45 41.5 22.5)"/>
  <ellipse cx="22.5" cy="41.5" rx="5" ry="8" fill="#F472B6" opacity="0.85" transform="rotate(-45 22.5 41.5)"/>
  <ellipse cx="41.5" cy="41.5" rx="5" ry="8" fill="#F472B6" opacity="0.85" transform="rotate(45 41.5 41.5)"/>

  <!-- Center circle -->
  <circle cx="32" cy="32" r="9" fill="#9D174D"/>

  <!-- Scissors icon in center -->
  <!-- Left blade -->
  <g transform="rotate(-20 32 32)">
    <line x1="26" y1="28" x2="38" y2="22" stroke="#FFD6EC" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="30" r="2.5" fill="none" stroke="#FFD6EC" stroke-width="1.5"/>
  </g>
  <!-- Right blade -->
  <g transform="rotate(20 32 32)">
    <line x1="38" y1="28" x2="26" y2="22" stroke="#FFD6EC" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="30" r="2.5" fill="none" stroke="#FFD6EC" stroke-width="1.5"/>
  </g>
  <!-- Screw/pivot -->
  <circle cx="32" cy="32" r="1.5" fill="#FFD6EC"/>
</svg>
