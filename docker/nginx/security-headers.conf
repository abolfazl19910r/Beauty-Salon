# ============================================================
# Mahru - هدرهای امنیتی nginx (بسته‌ی مجوز 5د، ۲۰۲۶-۱۰-۲۵)
#
# پاسخ‌های PHP این هدرها را از خود برنامه می‌گیرند (App\Http\Middleware\SecurityHeaders، config/security.php)؛
# متغیرهای $sec_* (nginx.conf) فقط وقتی برنامه هدر را نگذاشته مقدار دارند ← هدر تکراری نمی‌شود. برای فایل‌های ایستا
# (که از PHP رد نمی‌شوند) همین مقدارها را nginx می‌گذارد.
#
# ⚠️ nginx هدرهای add_header را فقط وقتی از بلوک بالاتر به ارث می‌برد که خود location هیچ add_header نداشته باشد؛
# پس هر location که add_header خودش را دارد (/build، /storage) این فایل را هم include می‌کند.
# ============================================================
add_header X-Content-Type-Options $sec_nosniff always;
add_header X-Frame-Options $sec_frame always;
add_header Referrer-Policy $sec_referrer always;
add_header Permissions-Policy $sec_permissions always;
