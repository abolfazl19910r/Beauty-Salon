# ============================================================
# Beauty Salon - Nginx Main Configuration
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ─────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ─── لاگ دسترسی ماندگار (بسته‌ی مجوز 5د؛ ماده‌ی ۶۶۸ آیین دادرسی کیفری) ─────
    # یک فایل در روز (UTC) در storage/logs/nginx — روی volume (تک‌کانتینری: /data/logs/nginx)، نه فقط لاگ Docker با سقف حجم.
    # $remote_addr بعد از real_ip همان IP واقعی است (فقط از لبه‌های TRUSTED_PROXIES)؛ peer آدرس خود اتصال (لبه‌ی CDN).
    # فشرده‌سازی و پاک‌سازی بعد از مهلت: php artisan retention:prune (config/retention.php، پیش‌فرض ۱۸۳ روز).
    # خود دستور access_log در conf.d/01-access-log.conf است (docker/nginx-setup.sh، فقط وقتی پوشه ساخته شد).
    map $time_iso8601 $mahru_log_date {
        "~^(?<ymd>\d{4}-\d{2}-\d{2})" $ymd;
        default                         undated;
    }
    log_format mahru escape=json '{"time":"$time_iso8601","ip":"$remote_addr","peer":"$realip_remote_addr",'
        '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"scheme":"$scheme","ref":"$http_referer","ua":"$http_user_agent","xff":"$http_x_forwarded_for"}';
    open_log_file_cache max=8 inactive=60s valid=60s min_uses=1;

    # ─── Performance ─────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    types_hash_max_size 2048;

    # ─── Compression (مهم برای React bundle) ─────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Security Headers ────────────────────────────────────
    # منبع اصلی: خود برنامه (config/security.php)؛ nginx فقط وقتی پاسخ هدر را ندارد (فایل‌های ایستا) — security-headers.conf
    server_tokens off;   # نسخه‌ی nginx در هدر Server و صفحه‌های خطا نیست؛ X-Powered-By را fastcgi_hide_header و expose_php برمی‌دارند
    map $upstream_http_x_content_type_options $sec_nosniff { '' nosniff; default ''; }
    map $upstream_http_x_frame_options $sec_frame { '' SAMEORIGIN; default ''; }
    map $upstream_http_referrer_policy $sec_referrer { '' strict-origin-when-cross-origin; default ''; }
    map $upstream_http_permissions_policy $sec_permissions { '' "camera=(), microphone=(), geolocation=(), payment=(), usb=()"; default ''; }
    include /etc/nginx/security-headers.conf;

    # ─── محدودیت اندازه و زمان درخواست (بسته‌ی مجوز 5د، مستقل از CDN) ─────
    # اندازه: گالری، عکس دوره و APK (همان post_max_size در docker/php/php.ini)
    client_max_body_size 25M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    # زمان: کندخوانی/کندنویسی (slowloris) اتصال را نگه ندارد
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 30s;
    reset_timedout_connection on;
    # هم‌زمانی از یک IP واقعی (پس از real_ip): سخاوتمند به‌خاطر CGNAT و HTTP/1.1 مرورگرها
    limit_conn_zone $binary_remote_addr zone=mahru_conn_per_ip:10m;
    limit_conn mahru_conn_per_ip 64;
    limit_conn_status 429;

    # ─── HTTPS روی خود مبدا (فقط وقتی /data/tls گواهی دارد؛ docker/nginx-setup.sh) ───
    # $mahru_trusted_proxy از conf.d/00-real-ip.conf (TRUSTED_PROXIES). درخواستی که لبه‌ی مورد اعتماد با HTTPS گرفته، healthcheck
    # (/up) و چالش ACME به HTTPS فرستاده نمی‌شوند؛ بقیه‌ی درخواست‌های پورت ۸۰ ← 301.
    map "$mahru_trusted_proxy:$http_x_forwarded_proto:$uri" $mahru_needs_https {
        "~^1:https:"                     0;
        "~:/up$"                         0;
        "~:/\.well-known/acme-challenge/" 0;
        default                          1;
    }

    include /etc/nginx/conf.d/*.conf;
}
