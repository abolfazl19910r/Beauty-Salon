# ============================================================
# Beauty Salon - Nginx Main Configuration
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ─────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ─────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ─── Compression (مهم برای React bundle) ─────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ─── Security Headers ────────────────────────────────────
    # منبع اصلی: خود برنامه (config/security.php)؛ nginx فقط وقتی پاسخ هدر را ندارد (فایل‌های ایستا) — security-headers.conf
    server_tokens off;
    map $upstream_http_x_content_type_options $sec_nosniff { '' nosniff; default ''; }
    map $upstream_http_x_frame_options $sec_frame { '' SAMEORIGIN; default ''; }
    map $upstream_http_referrer_policy $sec_referrer { '' strict-origin-when-cross-origin; default ''; }
    map $upstream_http_permissions_policy $sec_permissions { '' "camera=(), microphone=(), geolocation=(), payment=(), usb=()"; default ''; }
    include /etc/nginx/security-headers.conf;

    # ─── Upload size (گالری، تصویر سرویس‌ها) ─────────────────
    client_max_body_size 25M;
    client_body_timeout 120s;

    include /etc/nginx/conf.d/*.conf;
}
