# ============================================================
# Mahru - سرور HTTPS روی خود مبدا (بسته‌ی مجوز 5د): فقط وقتی /data/tls/fullchain.pem و privkey.pem هست،
# docker/nginx-setup.sh این فایل را در conf.d می‌گذارد. با CDN، لبه با HTTPS به همین وصل می‌شود؛ بدون CDN، مستقیم.
# گواهی: acme.sh روی میزبان (docs/deployment/ARVAN_SERVER.md بخش «HTTPS روی خود سرور»)؛ بعد از تمدید: nginx -s reload
# ============================================================

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /data/tls/fullchain.pem;
    ssl_certificate_key /data/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MahruTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/mahru/site.inc;
}
