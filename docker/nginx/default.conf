# ============================================================
# Beauty Salon - Nginx Virtual Host
# Laravel 11 + React SPA + Blade
# ============================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ─── Health check ────────────────────────────────────────
    location = /up {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # ─── Static Assets (Vite build output) ──────────────────
    # React admin bundle و CSS
    location /build {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── Storage (تصاویر آپلود شده) ──────────────────────────
    location /storage {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─── Favicon / Robots ────────────────────────────────────
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires max;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ─── Laravel Telescope (فقط در local/dev) ────────────────
    location /telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── phpMyAdmin proxy (در docker profile dev) ────────────
    # location /pma/ {
    #     proxy_pass http://phpmyadmin:80/;
    # }

    # ─── Main Laravel route ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ─────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;

        # Security
        fastcgi_hide_header X-Powered-By;
    }

    # ─── Block sensitive files ───────────────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    location ~ \.(log|json|lock|md)$ {
        deny all;
        return 404;
    }

    # ─── Error pages ─────────────────────────────────────────
    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;
}
