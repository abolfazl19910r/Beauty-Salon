# ============================================================
# Mahru - Nginx Virtual Host (پورت ۸۰)
#
# مسیرها در /etc/nginx/mahru/site.inc (مشترک با tls.conf). وقتی گواهی در /data/tls هست، docker/nginx-setup.sh سرور
# HTTPS را هم روشن می‌کند و https-redirect.inc این سرور را به HTTPS می‌فرستد (جز /up، چالش ACME و درخواستی که لبه‌ی CDN
# مورد اعتماد با X-Forwarded-Proto: https فرستاده — بسته‌ی مجوز 5د، امنیت مستقل از CDN).
# ============================================================

server {
    listen 80;
    server_name _;

    include /etc/nginx/mahru/https-redirect.inc;
    include /etc/nginx/mahru/site.inc;
}
