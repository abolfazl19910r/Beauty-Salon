; ============================================================
; Beauty Salon - PHP-FPM Pool Configuration
; ============================================================

[www]
user = www
group = www

; گوش دادن روی socket به جای TCP (سریع‌تر)
listen = /var/run/php-fpm/php-fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0660

; ─── Process Management ──────────────────────────────────────
; بررسی امنیتی H5 (۲۰۲۶-۱۱-۰۴): ۱۰ ← ۲۰. با سرور ۴ گیگ (MariaDB و worker صف در همان کانتینر) هر پردازه ~۴۰–۶۰ مگ ← ~۱ گیگ در بدترین
; حالت. پردازه‌ها فقط با بار ساخته می‌شوند (dynamic). سرور کوچک‌تر: کمتر کنید (free -m زیر بار).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
; صف انتظار وقتی هر ۲۰ پردازه مشغول‌اند (به‌جای رد شدن فوری اتصال‌ها)
listen.backlog = 256

; ─── Timeouts ────────────────────────────────────────────────
request_terminate_timeout = 120s

; ─── Logging ─────────────────────────────────────────────────
access.log = /proc/self/fd/2
slowlog = /var/www/html/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 5s

; ─── Environment variables ───────────────────────────────────
clear_env = no
