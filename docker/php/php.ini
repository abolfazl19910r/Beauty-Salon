; ============================================================
; Beauty Salon - PHP Configuration
; ============================================================

[PHP]
; ─── Error Handling ─────────────────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ─── Memory & Performance ────────────────────────────────────
memory_limit = 256M
max_execution_time = 120
max_input_time = 60
max_input_vars = 3000

; ─── File Uploads (تصویر سرویس‌ها، گالری) ───────────────────
upload_max_filesize = 20M
post_max_size = 25M
file_uploads = On

; ─── OPcache (بهبود عملکرد در production) ────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.validate_timestamps = 0

; ─── Session (از Redis استفاده میشه) ──────────────────────────
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

; ─── Date/Time ───────────────────────────────────────────────
date.timezone = Asia/Tehran

; ─── String/Encoding ─────────────────────────────────────────
default_charset = "UTF-8"
mbstring.language = UTF-8
mbstring.internal_encoding = UTF-8

; ─── PDF Generation (برای DomPDF/mPDF) ───────────────────────
; memory_limit بالاتر برای PDF های بزرگ
; (در controller های report فقط به صورت runtime تنظیم میشه)
