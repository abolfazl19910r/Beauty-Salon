; ============================================================
; Mahru — همه‌چیز در یک کانتینر (target «single»)
; MariaDB، PHP-FPM، Nginx، worker همه‌ی صف‌ها، worker اختصاصی کد تأیید، scheduler و پشتیبان شبانه (BACKUP_AT)
; ترتیب صف‌ها همان App\Support\Queues::workerOrder است.
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:mariadb]
command=/usr/bin/mariadbd
user=mysql
autostart=true
autorestart=true
priority=1
startsecs=5
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/usr/local/bin/wait-db php artisan queue:work --queue=otp,push,sms,payments,default,reports --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
priority=30
startsecs=3
stopwaitsecs=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-otp]
command=/usr/local/bin/wait-db php artisan queue:work --queue=otp --sleep=1 --tries=2 --max-time=3600 --timeout=30
autostart=true
autorestart=true
priority=30
startsecs=3
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/wait-db php artisan schedule:work
autostart=true
autorestart=true
priority=40
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backup]
; پشتیبان شبانه در /data/backups (docker/single/backup.sh)؛ BACKUP_AT خالی = خاموش و فقط منتظر
command=/usr/local/bin/mahru-backup loop
user=www
autostart=true
autorestart=true
priority=50
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
