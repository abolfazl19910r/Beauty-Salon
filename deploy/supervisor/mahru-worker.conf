; ============================================================
; Mahru — queue worker for a VPS without Docker (supervisor)
; ------------------------------------------------------------
; فقط وقتی سرور supervisor داره (VPS). روی DirectAdmin اشتراکی به‌جاش در .env:
;   QUEUE_WORK_VIA_SCHEDULER=true
; روی Docker لازم نیست (سرویس queue در docker-compose.yml).
;
; نصب:
;   1) [username] را با نام کاربری سرور عوض کن (و اگر پروژه جای دیگری است، مسیرها را)
;   2) sudo cp deploy/supervisor/mahru-worker.conf /etc/supervisor/conf.d/
;   3) sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start mahru-worker:*
;   4) بعد از هر deploy:  php artisan queue:restart
; راهنمای کامل: docs/deployment/SCHEDULER_AND_QUEUE.md
; ============================================================
[program:mahru-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/[username]/public_html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/home/[username]/public_html
user=[username]
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=100
redirect_stderr=true
stdout_logfile=/home/[username]/public_html/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
