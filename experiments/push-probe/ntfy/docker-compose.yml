# سرور ntfy روی سیستم لوکال برای آزمایش «راه بدون گوگل» — راهنما: README.md همین پوشه
# اگر Docker Hub از ایران در دسترس نبود، نام image را با یک mirror داخلی جایگزین کنید (NTFY_IMAGE در .env کنار همین فایل).
services:
  ntfy:
    image: ${NTFY_IMAGE:-binwiederhier/ntfy:latest}
    command: serve
    ports:
      - "8090:80"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      # کش SQLite در volume خود Docker، نه پوشه‌ی پروژه: روی ویندوز پوشه‌ی پروژه با git (stash/checkout) پاک می‌شد و ntfy
      # از آن به بعد روی هر انتشار و هر اتصال گوشی خطای 500 «disk I/O error: no such file or directory» می‌داد (۲۰۲۶-۱۰-۰۸)
      - ntfy-cache:/var/cache/ntfy
    restart: unless-stopped

volumes:
  ntfy-cache:
