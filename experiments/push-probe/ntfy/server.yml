# تنظیم حداقلی ntfy برای آزمایش (فقط شبکه‌ی محلی). مستند: docs.ntfy.sh/config
listen-http: ":80"
# پیام‌ها تا ۱۲ ساعت نگه داشته می‌شوند تا گوشی‌ای که مدتی وصل نبوده بعداً بگیرد
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "12h"
# فاصله‌ی پیام نگه‌داشتن اتصال (پیش‌فرض ntfy)؛ اثرش روی باتری را در فرم نتیجه ثبت می‌کنیم
keepalive-interval: "45s"
