<!-- Mahru — favicon & PWA. Place inside <head>. Files are expected at the site root. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="Mahru">
<meta name="theme-color" content="#1A1410">
<meta name="color-scheme" content="dark light">

<!-- Favicons: SVG for modern browsers, ICO (16/32/48) as fallback -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><!-- 180×180, full-bleed -->
<link rel="manifest" href="/site.webmanifest">

<!-- iOS home-screen app -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mahru">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Windows tiles -->
<meta name="msapplication-TileColor" content="#1A1410">
