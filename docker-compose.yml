# ============================================================
# Beauty Salon - Docker Compose
# Services: app (nginx + php-fpm), mysql, redis, queue, scheduler
# ============================================================

# ─── تنظیمات مشترک app / queue / scheduler ──────────────────
# ⭐ هر سه از یک image، یک .env و یک مجموعه override استفاده می‌کنن تا worker و scheduler دقیقاً همون
# تنظیمات app رو ببینن (قبلاً هر کدوم فهرست کوتاه‌تری داشتن؛ مثلاً قالب‌های پیامک و APP_URL به worker نمی‌رسید).
# .env روی سرور با «make setup» از .env.docker ساخته می‌شه. override‌های زیر فقط مخصوص شبکه‌ی docker هستن.
x-laravel-env: &laravel-env
  APP_TIMEZONE: "Asia/Tehran"
  APP_LOCALE: "fa"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  # در docker، worker جدا (سرویس queue) داریم؛ اجرای queue از داخل scheduler فقط برای هاست بدون supervisor است
  QUEUE_WORK_VIA_SCHEDULER: "false"
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: public

x-laravel: &laravel
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  restart: unless-stopped
  working_dir: /var/www/html
  env_file:
    - .env
  environment: *laravel-env
  volumes:
    - app_storage:/var/www/html/storage/app
    - app_logs:/var/www/html/storage/logs
  networks:
    - beauty_network
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ─── Laravel Application (PHP-FPM) ───────────────────────
  app:
    <<: *laravel
    container_name: beauty_salon_app
    # بدون command → entrypoint نقش web: migrate + cache + php-fpm + nginx
    # ⭐ همین container وب‌سرور سایته (nginx داخلش، کنار php-fpm روی سوکت unix). HTTPS بیرون از این stack
    # (Cloudflare Proxied یا nginx/certbot روی خود سرور — WILDCARD_SUBDOMAIN_DEPLOYMENT.md).
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      # nginx همین container /up رو به route سلامت Laravel می‌رسونه (php-fpm + boot برنامه). (قبلاً «php artisan health:check» بود — چنین دستوری نیست و
      # «||» در فرم exec آرگومان حساب می‌شد، پس app هیچ‌وقت healthy نمی‌شد و queue/scheduler اصلاً بالا نمی‌اومدن.)
      test: ["CMD-SHELL", "curl -fsS http://localhost/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s



  # ⚠️ سرویس جداگانه‌ی nginx حذف شد (۲۰۲۶-۰۹-۲۶): یک volume خالی (beauty_public، هیچ سرویسی پرش نمی‌کرد) رو
  # سرو می‌کرد و fastcgi_pass به سوکت php-fpm داخل container دیگه‌ای بود که بهش دسترسی نداشت؛ healthcheckش با
  # یک «200 OK» ثابت سالم نشون می‌داد. تنها پورت منتشرشده‌ی سایت همین بود، پس سایت روی Docker هیچ‌وقت بالا نیومد.


  # ─── MySQL Database ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: beauty_salon_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-beauty_salon}"
      MYSQL_USER: "${DB_USERNAME:-beauty_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      TZ: Asia/Tehran
    # ⚠️ فقط روی 127.0.0.1 سرور (Docker قوانین ufw رو دور می‌زنه؛ قبلاً MySQL به کل اینترنت باز بود)
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/beauty-salon.cnf:ro
      # اگر dump اولیه داری:
      # - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - beauty_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=2


  # ─── Redis (Cache + Queue + Session) ─────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: beauty_salon_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
    # ⚠️ فقط روی 127.0.0.1 سرور — Redis بدون رمز (REDIS_PASSWORD خالی پیش‌فرضه) قبلاً به کل اینترنت باز بود
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - beauty_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


  # ─── Queue Worker (database/redis) ───────────────────────
  queue:
    <<: *laravel
    container_name: beauty_salon_queue
    # entrypoint با آرگومان → نقش worker: بدون migrate/nginx، اجرای همین دستور با کاربر www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy   # یعنی migrationها تموم شدن


  # ─── Scheduler (Laravel Cron) ────────────────────────────
  scheduler:
    <<: *laravel
    container_name: beauty_salon_scheduler
    # schedule:work خودش هر دقیقه schedule:run می‌زنه. (حلقه‌ی قبلی «schedule:run && sleep 60» با هر خروج
    # غیرصفر sleep رو رد می‌کرد و بی‌وقفه تکرار می‌شد.)
    command: php artisan schedule:work
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy



  # ─── phpMyAdmin (فقط در development) ─────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: beauty_salon_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      PMA_ABSOLUTE_URI: "${APP_URL:-http://localhost}/pma/"
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - beauty_network
    profiles:
      - dev   # فقط با: docker compose --profile dev up


# ─── Named Volumes ────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local


# ─── Networks ─────────────────────────────────────────────────
networks:
  beauty_network:
    driver: bridge
    name: beauty_salon_network
