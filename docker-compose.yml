# ============================================================
# Beauty Salon - Docker Compose
# Services: app, nginx, mysql, redis, queue, scheduler
# ============================================================

services:

  # ─── Laravel Application (PHP-FPM) ───────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: beauty_salon_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "${APP_NAME:-Beauty Salon}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_TIMEZONE: "Asia/Tehran"
      APP_LOCALE: "fa"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-beauty_salon}"
      DB_USERNAME: "${DB_USERNAME:-beauty_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: public

      KAVENEGAR_API_KEY: "${KAVENEGAR_API_KEY:-}"
      KAVENEGAR_SENDER: "${KAVENEGAR_SENDER:-}"
      KAVENEGAR_TEMPLATE_LOGIN: "${KAVENEGAR_TEMPLATE_LOGIN:-}"
      KAVENEGAR_TEMPLATE_REGISTER: "${KAVENEGAR_TEMPLATE_REGISTER:-}"
      KAVENEGAR_TEMPLATE_RESET: "${KAVENEGAR_TEMPLATE_RESET:-}"
      KAVENEGAR_TEMPLATE_2FA: "${KAVENEGAR_TEMPLATE_2FA:-}"

      ZARINPAL_MERCHANT_ID: "${ZARINPAL_MERCHANT_ID:-}"
      ZARINPAL_SANDBOX: "${ZARINPAL_SANDBOX:-true}"

      TELESCOPE_ENABLED: "${TELESCOPE_ENABLED:-false}"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beauty_network
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check", "--no-interaction", "||", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # ─── Nginx Webserver ─────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: beauty_salon_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage/app:ro
      # public/build از app container mount میشه
      - beauty_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - beauty_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3


  # ─── MySQL Database ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: beauty_salon_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-beauty_salon}"
      MYSQL_USER: "${DB_USERNAME:-beauty_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      TZ: Asia/Tehran
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/beauty-salon.cnf:ro
      # اگر dump اولیه داری:
      # - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - beauty_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=2


  # ─── Redis (Cache + Queue + Session) ─────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: beauty_salon_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - beauty_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


  # ─── Queue Worker (database/redis) ───────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: beauty_salon_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_HOST: mysql
      DB_DATABASE: "${DB_DATABASE:-beauty_salon}"
      DB_USERNAME: "${DB_USERNAME:-beauty_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      KAVENEGAR_API_KEY: "${KAVENEGAR_API_KEY:-}"
      ZARINPAL_MERCHANT_ID: "${ZARINPAL_MERCHANT_ID:-}"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - beauty_network


  # ─── Scheduler (Laravel Cron) ────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: beauty_salon_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    # هر دقیقه schedule:run اجرا می‌کنه
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction && sleep 60; done"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_HOST: mysql
      DB_DATABASE: "${DB_DATABASE:-beauty_salon}"
      DB_USERNAME: "${DB_USERNAME:-beauty_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      KAVENEGAR_API_KEY: "${KAVENEGAR_API_KEY:-}"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - beauty_network


  # ─── phpMyAdmin (فقط در development) ─────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: beauty_salon_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      PMA_ABSOLUTE_URI: "${APP_URL:-http://localhost}/pma/"
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - beauty_network
    profiles:
      - dev   # فقط با: docker compose --profile dev up


# ─── Named Volumes ────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local
  beauty_public:
    driver: local


# ─── Networks ─────────────────────────────────────────────────
networks:
  beauty_network:
    driver: bridge
    name: beauty_salon_network
